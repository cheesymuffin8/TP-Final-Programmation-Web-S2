<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combat de Rue</title>

    <link rel="stylesheet" href="CSS/styles.css">

    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>

</head>

<body>

    <div class="arcade-machine">

        <!-- Haut arcade (Maxime)-->
        <div class="arcade-top">

            <div class="arcade-title">
                COMBAT DE RUE
            </div>

        </div>

        <!-- Écran (Maxime)-->
        <div class="screen-container">

            <div id="mainContainer" class="noSelect"></div>

        </div>

<!-- Panel arcade -->
<div class="controls-panel">

    <!-- Côté joueur 1 -->
    <div class="player-controls">

        <div class="joystick" id="joy1">
            <div class="stick"></div>
            <div class="ball red"></div>

        </div>

        <div class="buttons">
            <div class="btn red-btn"></div>
            <div class="btn red-btn"></div>
            <div class="btn red-btn"></div>
            <div class="btn red-btn"></div>

        </div>

    </div>

    <!-- Centre -->
    <div class="coin-section">

        <p>INSERT COIN</p>
        <div class="coin-lights">
            <div class="coin-light"></div>
            <div class="coin-light"></div>

        </div>

    </div>

    <!-- Côté joueur 2 -->
    <div class="player-controls">

        <div class="buttons">
            <div class="btn blue-btn"></div>
            <div class="btn blue-btn"></div>
            <div class="btn blue-btn"></div>
            <div class="btn blue-btn"></div>

        </div>

        <div class="joystick" id="joy2">
            <div class="stick"></div>
            <div class="ball blue"></div>

        </div>

    </div>

</div>

    <script src="JS/keys.js"></script>
    <script src="JS/script.js"></script>

</body>
